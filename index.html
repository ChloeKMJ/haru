<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>저녁 기록</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #fff; --ink: #1d1d1d; --soft: #6a6a6a; --box: #f2f2f2; --red: #e2432b; --on-ink: #fff; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #161616; --ink: #f2f2f2; --soft: #a5a5a5; --box: #272727; --red: #f0745f; --on-ink: #161616; }
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0 auto; max-width: 480px; min-height: 100dvh; color: var(--ink);
  font: 16px/1.5 "IBM Plex Sans KR", system-ui, sans-serif;
  padding: max(22px, env(safe-area-inset-top)) 18px 170px;
}
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid #2a5bd7; outline-offset: 2px; }

/* 머리: 왼쪽 날짜·물음, 오른쪽 도장 든 직원 */
header { position: relative; display: flex; align-items: flex-end; min-height: 150px; margin-bottom: 12px; }
header p { margin: 0; font-size: 14px; color: var(--soft); }
h1 { margin: 2px 0 6px; font-size: 34px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; }
/* 직원은 빨간 구역 뒤에서 올라온 것처럼: 아래쪽이 구역에 가려진다 */
.who { position: absolute; right: -2px; bottom: -30px; width: 172px; }
.who svg { display: block; width: 100%; overflow: visible; }
.who .prop { transform-box: fill-box; transform-origin: 50% 0; }
.who.hit .prop { animation: hit .5s ease-out; }
@keyframes hit { 30% { transform: translate(-10px, 12px) rotate(-18deg); } }
#mark {
  position: absolute; left: 168px; bottom: 44px; width: 60px; height: 60px; border-radius: 50%;
  border: 3px solid var(--red); color: var(--red); display: grid; place-content: center; text-align: center;
  font: 700 13px/1.2 "IBM Plex Sans KR", sans-serif; transform: rotate(-10deg); background: var(--bg);
}
#mark[hidden] { display: none; }
#mark.new { animation: press .3s .22s cubic-bezier(.2, .9, .3, 1.3) backwards; }
@keyframes press { from { transform: rotate(-10deg) scale(1.9); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #mark.new, .who.hit .prop { animation: none; } }

/* 기분: 네 가지 색 구역 */
.quad { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.q { border-radius: 22px; padding: 14px 10px 12px 12px; min-height: 178px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 7px; }
.q b { flex-basis: 100%; font-size: 13px; font-weight: 600; opacity: .78; margin-bottom: 2px; }
.q button { background: rgba(255, 255, 255, .55); border: 0; border-radius: 999px; padding: 9px 14px; min-height: 40px; font-size: 16px; font-weight: 600; color: inherit; }
.q button[aria-pressed="true"] { background: #1d1d1d; color: #fff; }
.y { background: #f9d85a; color: #4a3900; } .r { background: #f0745f; color: #4a0e05; }
.g { background: #8fd0a0; color: #0f3a1c; } .u { background: #8fb0ee; color: #0e2452; }
.n { grid-column: 1 / -1; min-height: 0; background: var(--box); color: var(--ink); align-items: center; }
.n b { flex-basis: auto; margin: 0 4px 0 2px; }
.n button { background: var(--bg); }
.n button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }

.field { margin-top: 10px; background: var(--box); border-radius: 18px; padding: 12px 14px; }
.field label, .field .lab { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
textarea { display: block; width: 100%; border: 0; background: transparent; color: var(--ink); resize: none; font: inherit; font-size: 17px; height: 76px; padding: 0; }
textarea:focus { outline: none; }
.field:focus-within { outline: 3px solid #2a5bd7; outline-offset: 2px; }
textarea::placeholder { color: var(--soft); }
.read { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.read .lab { margin: 0; font-size: 16px; }
.read div { display: flex; gap: 6px; }
.read button { background: var(--bg); color: var(--ink); border: 0; border-radius: 999px; padding: 9px 14px; min-height: 40px; font-size: 15px; font-weight: 600; }
.read button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }

.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); padding: 8px 18px calc(18px + env(safe-area-inset-bottom)); }
.bar > div { max-width: 444px; margin: 0 auto; }
#state { margin: 0 0 8px; font-size: 14px; color: var(--soft); text-align: center; min-height: 21px; }
#stamp { width: 100%; background: var(--ink); color: var(--on-ink); border: 0; border-radius: 18px; padding: 17px; font-size: 18px; font-weight: 700; }
#stamp:disabled { background: var(--box); color: var(--soft); cursor: default; }
#stamp:active:not(:disabled) { transform: scale(.98); }

details { margin-top: 10px; background: var(--box); border-radius: 18px; padding: 4px 14px; }
details:first-of-type { margin-top: 28px; }
summary { font-weight: 600; padding: 10px 0; cursor: pointer; }
#past { list-style: none; margin: 0; padding: 0 0 8px; }
#past li { padding: 9px 0; border-top: 1px solid var(--bg); font-size: 15px; }
#past time { font-weight: 700; margin-right: 8px; }
#past .wait { color: var(--red); font-size: 13px; margin-left: 6px; }
.set label { display: block; margin-top: 10px; font-size: 14px; color: var(--soft); }
.set input { width: 100%; margin-top: 4px; font: inherit; color: var(--ink); background: var(--bg); border: 0; border-radius: 12px; padding: 11px 12px; }
.set .hint { margin: 0; font-size: 14px; color: var(--soft); }
#saveSet { margin: 14px 0 6px; background: var(--ink); color: var(--on-ink); border: 0; border-radius: 14px; padding: 12px 18px; font-weight: 700; }
#setMsg { min-height: 21px; padding-bottom: 8px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter></defs></svg>

<header>
  <div>
    <p id="date"></p>
    <h1>지금 어때요?</h1>
  </div>
  <div id="mark" hidden></div>
  <!-- 비서실 직원 '저녁 기록' (공용\비서실 껍데기\캐릭터_손그림.js 로 뽑은 그림) -->
  <div class="who" id="who" aria-hidden="true">
    <svg viewBox="0 0 120 124"><g filter="url(#wobble)">
      <path d="M30 118 C30 92 90 92 90 118 Z" fill="#2a5bd7" stroke="#1d1d1d" stroke-width="3"/>
      <circle cx="60" cy="60" r="26" fill="#fff" stroke="#1d1d1d" stroke-width="3"/><path d="M32 50 C34 30 86 30 88 50 L80 44 L72 52 L64 44 L56 52 L48 44 L40 52 Z" fill="#1d1d1d"/><circle cx="50" cy="60" r="2.6" fill="#1d1d1d"/><circle cx="70" cy="60" r="2.6" fill="#1d1d1d"/><path d="M54 70 Q60 76 66 70" fill="none" stroke="#1d1d1d" stroke-width="3" stroke-linecap="round"/><circle cx="42" cy="68" r="4" fill="#f7a8b8" opacity=".7"/><circle cx="78" cy="68" r="4" fill="#f7a8b8" opacity=".7"/>
      <g class="prop"><g transform="translate(97 86) rotate(14)"><rect x="-4" y="-28" width="8" height="14" rx="3" fill="#e2432b" stroke="#1d1d1d" stroke-width="3"/><rect x="-11" y="-14" width="22" height="8" rx="2" fill="#fff" stroke="#1d1d1d" stroke-width="3"/><rect x="-13" y="-6" width="26" height="4" fill="#1d1d1d"/></g></g>
    </g></svg>
  </div>
</header>

<div class="quad" id="moods"></div>

<div class="field">
  <label for="line">한 줄로 적는다면</label>
  <textarea id="line" maxlength="300" placeholder="오늘 제일 오래 남은 일. 안 적어도 돼요."></textarea>
</div>
<div class="field read">
  <span class="lab">오늘 책 10분</span>
  <div id="read">
    <button type="button" data-v="1" aria-pressed="false">읽었어요</button>
    <button type="button" data-v="0" aria-pressed="false">못 읽었어요</button>
  </div>
</div>

<details>
  <summary>지난 기록</summary>
  <ul id="past"></ul>
</details>
<details class="set">
  <summary>연결 설정</summary>
  <p class="hint">기록을 깃허브 비공개 저장소에 보내는 데 써요. 이 폰에만 저장돼요.</p>
  <label>깃허브 계정 이름 <input id="owner" autocomplete="off" autocapitalize="off"></label>
  <label>저장소 이름 <input id="repo" autocomplete="off" autocapitalize="off" placeholder="haru-data"></label>
  <label>열쇠(토큰) <input id="token" type="password" autocomplete="off"></label>
  <button id="saveSet" type="button">설정 저장</button>
  <p class="hint" id="setMsg" role="status"></p>
</details>

<div class="bar"><div>
  <p id="state" role="status"></p>
  <button id="stamp" type="button" disabled>적기</button>
</div></div>

<script>
// 기분 낱말 — 기운(높음·낮음) × 느낌(좋음·힘듦) 네 구역 + 어느 쪽도 아닌 것
const MOODS = [
  ["y", "기운 나고 좋음", ["뿌듯함", "즐거움", "설렘"]],
  ["r", "기운이 곤두섬", ["답답함", "불안함", "짜증"]],
  ["g", "잔잔하고 좋음", ["편안함", "고마움", "홀가분함"]],
  ["u", "가라앉음", ["피곤함", "지침", "서운함", "우울함", "허전함"]],
  ["n", "어느 쪽도 아님", ["무덤덤", "잘 모르겠음"]],
];
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
// ponytail: 새벽 4시 전은 전날 저녁으로 친다. 밤샘 근무가 잦아지면 설정으로 뺀다.
function dayOf(now) { const d = new Date(now); if (d.getHours() < 4) d.setDate(d.getDate() - 1); return d; }

const today = dayOf(new Date());
$("date").textContent = `${today.getMonth() + 1}월 ${today.getDate()}일 ${"일월화수목금토"[today.getDay()]}요일 저녁`;

for (const [tone, title, words] of MOODS) {
  const g = document.createElement("div"); g.className = "q " + tone; g.setAttribute("role", "group"); g.setAttribute("aria-label", title);
  const b = document.createElement("b"); b.textContent = title; g.append(b);
  for (const m of words) {
    const x = document.createElement("button"); x.type = "button"; x.textContent = m; x.setAttribute("aria-pressed", "false"); g.append(x);
  }
  $("moods").append(g);
}
const picked = () => [...document.querySelectorAll("#moods [aria-pressed=true]")].map(b => b.textContent);
const readVal = () => { const b = document.querySelector("#read [aria-pressed=true]"); return b ? b.dataset.v === "1" : null; };

const doneToday = () => { const l = store.get("h", [])[0]; return !!l && l.날짜 === ymd(dayOf(new Date())); };
function refresh() {
  const n = picked().length, has = n || $("line").value.trim() || readVal() !== null;
  $("stamp").disabled = !has;
  const again = doneToday();
  $("stamp").textContent = again ? "다시 적기" : "적기";
  $("state").textContent = !has ? (again ? "오늘은 적었어요. 다시 적으면 새 것으로 바뀌어요." : "기분을 고르거나 한 줄을 적어 주세요.")
    : n ? `기분 ${n}개 골랐어요.` : "";
}
$("moods").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); refresh();
});
$("read").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const on = b.getAttribute("aria-pressed") === "true";
  for (const x of $("read").children) x.setAttribute("aria-pressed", "false");
  b.setAttribute("aria-pressed", !on); refresh();
});
$("line").addEventListener("input", refresh);

// ── 보내기: 기록 하나 = 저장소의 파일 하나(log/날짜T시각.json). 못 보낸 것은 폰에 두었다가 다음에 다시 보낸다.
const cfg = () => store.get("cfg", {});
const ready = () => { const c = cfg(); return c.owner && c.repo && c.token; };
const b64 = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
async function send(rec) {
  const c = cfg();
  const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/log/${rec.id}.json`, {
    method: "PUT",
    headers: { Authorization: `Bearer ${c.token}`, Accept: "application/vnd.github+json" },
    body: JSON.stringify({ message: `기록 ${rec.id}`, content: b64(JSON.stringify(rec, null, 1)) }),
  });
  if (!r.ok && r.status !== 422) throw new Error(r.status);   // 422 = 이미 올라간 파일
}
async function flush() {
  if (!ready()) return "설정없음";
  let q = store.get("q", []), err = "";
  for (const rec of [...q]) {
    try { await send(rec); q = q.filter(x => x.id !== rec.id); store.set("q", q); }
    catch (e) { err = String(e.message); break; }
  }
  return err;
}
function explain(err) {
  if (!err) return "";
  if (err === "설정없음") return "폰에 적어 뒀어요. 연결 설정을 채우면 노트로 넘어가요.";
  if (err === "401" || err === "403") return "열쇠가 맞지 않거나 기한이 끝났어요. 연결 설정에서 새 열쇠를 넣어 주세요. 기록은 폰에 있어요.";
  if (err === "404") return "저장소를 못 찾았어요. 연결 설정의 계정 이름과 저장소 이름을 확인해 주세요. 기록은 폰에 있어요.";
  return "지금은 못 보냈어요. 폰에 적어 뒀고, 다음에 열 때 다시 보내요.";
}

function showMark(rec, fresh) {
  const m = $("mark"); m.hidden = false; m.innerHTML = `${rec.시각}<br>적음`;
  m.classList.remove("new"); $("who").classList.remove("hit");
  if (fresh) { void m.offsetWidth; m.classList.add("new"); $("who").classList.add("hit"); }
}
function drawPast() {
  const waiting = new Set(store.get("q", []).map(x => x.id));
  $("past").innerHTML = "";
  for (const r of store.get("h", []).slice(0, 14)) {
    const li = document.createElement("li"), t = document.createElement("time");
    t.textContent = `${r.날짜.slice(5).replace("-", ".")} ${r.시각}`;
    li.append(t, [r.기분.join(", "), r.한줄, r.독서 === true ? "책 읽음" : r.독서 === false ? "책 못 읽음" : ""].filter(Boolean).join(" / "));
    if (waiting.has(r.id)) { const w = document.createElement("span"); w.className = "wait"; w.textContent = "보내기 전"; li.append(w); }
    $("past").append(li);
  }
  if (!$("past").children.length) $("past").innerHTML = "<li>아직 적은 기록이 없어요.</li>";
}

$("stamp").addEventListener("click", async () => {
  const now = new Date(), d = dayOf(now);
  const rec = { id: `${ymd(now)}T${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`,
                날짜: ymd(d), 시각: `${pad(now.getHours())}:${pad(now.getMinutes())}`,
                기분: picked(), 한줄: $("line").value.trim(), 독서: readVal() };
  store.set("q", [...store.get("q", []), rec]);            // 먼저 폰에 적고 나서 보낸다
  store.set("h", [rec, ...store.get("h", []).filter(x => x.날짜 !== rec.날짜)].slice(0, 60));   // 같은 날은 마지막 것만
  document.querySelectorAll("[aria-pressed=true]").forEach(b => b.setAttribute("aria-pressed", "false"));
  $("line").value = ""; refresh();
  scrollTo({ top: 0, behavior: "smooth" }); showMark(rec, true); drawPast();
  $("state").textContent = "보내는 중이에요.";
  const err = await flush();
  $("state").textContent = explain(err) || "적었어요. 내일 아침 노트에 들어가요.";
  drawPast();
});

// ── 설정
function loadSet() { const c = cfg(); $("owner").value = c.owner || ""; $("repo").value = c.repo || ""; $("token").value = c.token || ""; }
$("saveSet").addEventListener("click", async () => {
  store.set("cfg", { owner: $("owner").value.trim(), repo: $("repo").value.trim(), token: $("token").value.trim() });
  loadSet();
  if (!ready()) return $("setMsg").textContent = "세 칸을 모두 채워 주세요.";
  $("setMsg").textContent = "확인하는 중이에요.";
  const c = cfg();
  try {
    const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}`, { headers: { Authorization: `Bearer ${c.token}` } });
    $("setMsg").textContent = r.ok ? "연결됐어요." : explain(String(r.status));
    if (r.ok) { await flush(); drawPast(); }
  } catch { $("setMsg").textContent = "인터넷 연결을 확인해 주세요."; }
});

loadSet(); drawPast(); refresh();
const last = store.get("h", [])[0];
if (last && last.날짜 === ymd(today)) showMark(last, false);
flush().then(drawPast);
</script>
</body>
</html>
